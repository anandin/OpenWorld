<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>OpenWorld</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230b1220'/><path d='M8 44 L24 28 L36 36 L56 16' stroke='%23a8e063' stroke-width='4' fill='none'/></svg>" />
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1220;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: #0b1220;
        transition: opacity 0.4s ease-out;
        z-index: 10;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.2em;
        margin: 0;
        color: #a8e063;
      }
      #boot p {
        font-size: 12px;
        color: #8b95a7;
        margin: 0;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #a8e063;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>OPENWORLD</h1>
      <p>booting…</p>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
